<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Cinema camera on a tripod with a 30mm Studio clapperboard">
  <defs>
    <radialGradient id="spot" cx="58%" cy="34%" r="62%">
      <stop offset="0" stop-color="#4a1a1d"/>
      <stop offset=".55" stop-color="#1a1414"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a2226"/>
      <stop offset=".5" stop-color="#140c0d"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#spot)"/>
  <rect y="760" width="800" height="240" fill="url(#floor)"/>
  <path d="M0 760H800" stroke="#262626" stroke-width="2"/>
  <ellipse cx="470" cy="900" rx="230" ry="26" fill="#000" opacity=".5"/>

  <!-- Tripod -->
  <g stroke="#2e2e2e" stroke-width="14" stroke-linecap="round">
    <path d="M470 520L330 895"/>
    <path d="M470 520L610 895"/>
    <path d="M470 520L470 905"/>
  </g>
  <g stroke="#3d3d3d" stroke-width="4" stroke-linecap="round">
    <path d="M395 720L545 720"/>
    <path d="M470 720V780"/>
  </g>
  <rect x="430" y="496" width="80" height="34" rx="6" fill="#262626"/>
  <rect x="452" y="470" width="36" height="30" rx="4" fill="#1f1f1f"/>
  <path d="M500 512L640 560" stroke="#2e2e2e" stroke-width="10" stroke-linecap="round"/>

  <!-- Camera body -->
  <rect x="390" y="330" width="200" height="140" rx="12" fill="url(#metal)"/>
  <rect x="390" y="330" width="200" height="140" rx="12" fill="none" stroke="#454545" stroke-width="2"/>
  <rect x="590" y="350" width="60" height="100" rx="8" fill="#232323"/>
  <rect x="410" y="350" width="70" height="26" rx="4" fill="#161616"/>
  <circle cx="560" cy="358" r="7" fill="#a3282d"/>
  <rect x="520" y="400" width="54" height="46" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <circle cx="547" cy="423" r="12" fill="#262626"/>

  <!-- Top handle -->
  <path d="M420 330V300H570V330" fill="none" stroke="#333" stroke-width="12" stroke-linejoin="round"/>

  <!-- Monitor -->
  <path d="M560 300L600 262" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <rect x="585" y="196" width="132" height="86" rx="8" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="596" y="206" width="110" height="66" rx="3" fill="#2a1013"/>
  <circle cx="612" cy="220" r="4" fill="#a3282d"/>
  <rect x="622" y="216" width="26" height="8" rx="2" fill="#d8898c" opacity=".7"/>
  <path d="M600 262L640 238L664 252L702 226" fill="none" stroke="#7a3a3e" stroke-width="2"/>

  <!-- Lens -->
  <rect x="300" y="352" width="92" height="96" rx="6" fill="#202020"/>
  <g fill="#2d2d2d">
    <rect x="312" y="352" width="10" height="96"/>
    <rect x="334" y="352" width="10" height="96"/>
    <rect x="356" y="352" width="10" height="96"/>
  </g>
  <rect x="236" y="340" width="70" height="120" rx="6" fill="#1a1a1a"/>
  <!-- Matte box -->
  <path d="M236 330L160 300V500L236 470Z" fill="#171717" stroke="#2f2f2f" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="236" cy="400" rx="16" ry="50" fill="url(#glass)"/>
  <ellipse cx="232" cy="384" rx="5" ry="14" fill="#fff" opacity=".18"/>

  <!-- Clapperboard -->
  <g transform="translate(70 640) rotate(-8)">
    <rect x="0" y="62" width="300" height="200" rx="8" fill="#141414" stroke="#2c2c2c" stroke-width="3"/>
    <g transform="rotate(-14 0 58)">
      <rect x="0" y="20" width="300" height="38" rx="4" fill="#e8e6e3"/>
      <path d="M30 20L58 58H88L60 20ZM100 20L128 58H158L130 20ZM170 20L198 58H228L200 20ZM240 20L268 58H298L270 20Z" fill="#111"/>
    </g>
    <rect x="0" y="62" width="300" height="34" fill="#e8e6e3"/>
    <path d="M30 62L56 96H86L60 62ZM100 62L126 96H156L130 62ZM170 62L196 96H226L200 62ZM240 62L266 96H296L270 62Z" fill="#111"/>
    <circle cx="14" cy="60" r="7" fill="#3a3a3a"/>
    <g font-family="Poppins, Helvetica, Arial, sans-serif" fill="#e8e6e3">
      <text x="20" y="132" font-size="24" font-weight="600" letter-spacing="2">30MM STUDIO</text>
      <path d="M20 146H280M20 196H280M150 152V244" stroke="#3a3a3a" stroke-width="2"/>
      <text x="20" y="172" font-size="12" fill="#8f8b87" letter-spacing="2">SCENE</text>
      <text x="20" y="190" font-size="18">01</text>
      <text x="164" y="172" font-size="12" fill="#8f8b87" letter-spacing="2">TAKE</text>
      <text x="164" y="190" font-size="18">03</text>
      <text x="20" y="222" font-size="12" fill="#8f8b87" letter-spacing="2">ROLL</text>
      <text x="20" y="240" font-size="18">A</text>
      <text x="164" y="222" font-size="12" fill="#8f8b87" letter-spacing="2">LENS</text>
      <text x="164" y="240" font-size="18" fill="#c0484d">30mm</text>
    </g>
  </g>

  <!-- Light stand -->
  <g stroke="#262626" stroke-width="8" stroke-linecap="round">
    <path d="M700 420V880"/>
    <path d="M700 880L650 920M700 880L750 920"/>
  </g>
  <path d="M660 360H740L760 430H640Z" fill="#1e1e1e" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M640 430H760" stroke="#a3282d" stroke-width="4" opacity=".7"/>
</svg>
